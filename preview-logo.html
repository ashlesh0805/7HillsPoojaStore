<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tirumala Gopuram + 7 Hills Logo Refinements</title>
  <style>
    body {
      background: #0F0204;
      color: #FFF;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      max-width: 900px;
    }
    .card {
      background: #1C0508;
      border: 1px solid #4A0812;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header-mockup {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #FFFFFF;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      width: 340px;
    }
    .brand-flame-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, #5C0612, #850E1E);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 2px 8px rgba(92, 6, 18, 0.35);
    }
    .brand-name {
      font-family: Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      color: #7A0C1A;
      line-height: 1.15;
    }
    .brand-sub {
      font-size: 9.5px;
      color: #B45309;
      font-weight: 600;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <h1 style="color: #FDE68A; font-family: Georgia, serif; font-size: 24px; margin: 0;">
    7 Hills of Tirumala with Gopuram Logo
  </h1>

  <div class="grid">
    <!-- Variation 1: Clean High-Contrast Sacred Silhouette -->
    <div class="card">
      <h3 style="margin: 0; font-size: 15px; color: #F59E0B;">Design A: Header Preview (36px Badge)</h3>
      <div class="header-mockup">
        <div class="brand-flame-icon">
          <!-- 7 Hills + Tirumala Gopuram SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 40 40" fill="none">
            <defs>
              <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FFFBEB"/>
                <stop offset="40%" stop-color="#FCD34D"/>
                <stop offset="100%" stop-color="#F59E0B"/>
              </linearGradient>
              <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#F59E0B"/>
                <stop offset="100%" stop-color="#B45309"/>
              </linearGradient>
            </defs>

            <!-- Divine Sun Rays behind Gopuram -->
            <path d="M20 18 L14 7 M20 18 L20 6 M20 18 L26 7" stroke="#FDE68A" stroke-width="0.8" stroke-dasharray="1 1" opacity="0.4"/>

            <!-- THE 7 SACRED HILLS (Base Layer) -->
            <!-- Hills Background Silhouette (7 Peaks) -->
            <!-- Peak 1 (Leftmost) -->
            <path d="M0 34 Q3 28 6 30 Q9 26 12 28 Q15 24 18 27 Q20 22 22 27 Q25 24 28 28 Q31 26 34 30 Q37 28 40 34 L40 38 L0 38 Z" fill="#92400E" opacity="0.35"/>

            <!-- Foreground 7 Hills Contours with Gold Highlights -->
            <!-- Hill 1 (Seshadri) -->
            <path d="M0 35 C2 30, 5 30, 7 34" stroke="url(#hillGrad)" stroke-width="1.3" stroke-linecap="round"/>
            <!-- Hill 2 (Neeladri) -->
            <path d="M5 34 C8 28.5, 11 28.5, 13 33" stroke="url(#hillGrad)" stroke-width="1.3" stroke-linecap="round"/>
            <!-- Hill 3 (Garudadri) -->
            <path d="M10 33 C13 26.5, 16 27, 18 31" stroke="url(#hillGrad)" stroke-width="1.3" stroke-linecap="round"/>
            <!-- Hill 4 (Venkatadri - Sacred Center beneath Gopuram) -->
            <path d="M15 31 C18 25, 22 25, 25 31" stroke="url(#goldLight)" stroke-width="1.6" stroke-linecap="round"/>
            <!-- Hill 5 (Narayanadri) -->
            <path d="M22 31 C24 27, 27 26.5, 30 33" stroke="url(#hillGrad)" stroke-width="1.3" stroke-linecap="round"/>
            <!-- Hill 6 (Vrishabhadri) -->
            <path d="M27 33 C29 28.5, 32 28.5, 35 34" stroke="url(#hillGrad)" stroke-width="1.3" stroke-linecap="round"/>
            <!-- Hill 7 (Anjanadri) -->
            <path d="M33 34 C35 30, 38 30, 40 35" stroke="url(#hillGrad)" stroke-width="1.3" stroke-linecap="round"/>

            <!-- Base Ground Line -->
            <path d="M0 36.5 L40 36.5" stroke="#D97706" stroke-width="1.4"/>

            <!-- THE MAJESTIC TIRUMALA GOPURAM -->
            <!-- 3 Kalasams (Golden Spire Finials on Summit) -->
            <path d="M20 4.5 L20 7 M17 6 L17 8 M23 6 L23 8" stroke="url(#goldLight)" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="20" cy="4.5" r="0.8" fill="#FFFBEB"/>
            <circle cx="17" cy="6" r="0.7" fill="#FDE68A"/>
            <circle cx="23" cy="6" r="0.7" fill="#FDE68A"/>

            <!-- Shikhara (Dome / Sala Roof) -->
            <path d="M15 8.5 C16 7, 24 7, 25 8.5 Z" fill="url(#goldLight)" stroke="#D97706" stroke-width="0.8"/>
            <line x1="14" y1="9" x2="26" y2="9" stroke="url(#goldLight)" stroke-width="1.2" stroke-linecap="round"/>

            <!-- Tier 1 (Top Tala) -->
            <path d="M15.5 9.5 L14.5 13 L25.5 13 L24.5 9.5 Z" fill="#5C0612" fill-opacity="0.3" stroke="url(#goldLight)" stroke-width="1.1"/>
            <!-- Tier 1 Center Niche -->
            <rect x="19" y="10.5" width="2" height="2.5" rx="0.5" fill="url(#goldLight)"/>
            <line x1="13" y1="13.5" x2="27" y2="13.5" stroke="url(#goldLight)" stroke-width="1.3" stroke-linecap="round"/>

            <!-- Tier 2 (Middle Tala) -->
            <path d="M14 14 L12.8 18.5 L27.2 18.5 L26 14 Z" fill="#5C0612" fill-opacity="0.3" stroke="url(#goldLight)" stroke-width="1.1"/>
            <!-- Tier 2 Pillars / Kudus -->
            <line x1="16.5" y1="14.5" x2="16.5" y2="18" stroke="url(#goldLight)" stroke-width="0.9"/>
            <rect x="19" y="15" width="2" height="3" rx="0.5" fill="url(#goldLight)"/>
            <line x1="23.5" y1="14.5" x2="23.5" y2="18" stroke="url(#goldLight)" stroke-width="0.9"/>
            <line x1="11.5" y1="19" x2="28.5" y2="19" stroke="url(#goldLight)" stroke-width="1.4" stroke-linecap="round"/>

            <!-- Tier 3 (Lower Tala / Base) -->
            <path d="M12.5 19.5 L11.2 25 L28.8 25 L27.5 19.5 Z" fill="#5C0612" fill-opacity="0.3" stroke="url(#goldLight)" stroke-width="1.1"/>
            <!-- Gopuram Main Arch Gateway (Dwaram / Sanctum Sanctorum) -->
            <path d="M17.5 25.5 V21 C17.5 19.8, 22.5 19.8, 22.5 21 V25.5" fill="#FFFBEB" fill-opacity="0.4" stroke="url(#goldLight)" stroke-width="1.2"/>
            <!-- Center Deity Divine Light inside Sanctum -->
            <circle cx="20" cy="22.5" r="1.2" fill="#FFFBEB"/>
            <line x1="10" y1="25.5" x2="30" y2="25.5" stroke="url(#goldLight)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">7 Hills Pooja Store</div>
          <div class="brand-sub">Positive Energy in Every Item.</div>
        </div>
      </div>
    </div>

    <!-- Variation 2: High Resolution 80px Card Preview -->
    <div class="card">
      <h3 style="margin: 0; font-size: 15px; color: #F59E0B;">App Icon / Emblem (80px View)</h3>
      <div style="width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, #4A040D, #7A0C1A, #3A0208); display: flex; align-items: center; justify-content: center; border: 2px solid #F59E0B; box-shadow: 0 4px 16px rgba(0,0,0,0.6);">
        <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 40 40" fill="none">
          <!-- Same Clean SVG scaled to 60px -->
          <defs>
            <linearGradient id="goldLight2" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFFBEB"/>
              <stop offset="40%" stop-color="#FCD34D"/>
              <stop offset="100%" stop-color="#F59E0B"/>
            </linearGradient>
            <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#F59E0B"/>
              <stop offset="100%" stop-color="#B45309"/>
            </linearGradient>
          </defs>

          <!-- Rays -->
          <path d="M20 18 L14 7 M20 18 L20 6 M20 18 L26 7" stroke="#FDE68A" stroke-width="0.8" stroke-dasharray="1 1" opacity="0.4"/>

          <!-- 7 Hills Background -->
          <path d="M0 34 Q3 28 6 30 Q9 26 12 28 Q15 24 18 27 Q20 22 22 27 Q25 24 28 28 Q31 26 34 30 Q37 28 40 34 L40 38 L0 38 Z" fill="#92400E" opacity="0.35"/>

          <!-- 7 Hills Peaks -->
          <path d="M0 35 C2 30, 5 30, 7 34" stroke="url(#hillGrad2)" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M5 34 C8 28.5, 11 28.5, 13 33" stroke="url(#hillGrad2)" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M10 33 C13 26.5, 16 27, 18 31" stroke="url(#hillGrad2)" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M15 31 C18 25, 22 25, 25 31" stroke="url(#goldLight2)" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M22 31 C24 27, 27 26.5, 30 33" stroke="url(#hillGrad2)" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M27 33 C29 28.5, 32 28.5, 35 34" stroke="url(#hillGrad2)" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M33 34 C35 30, 38 30, 40 35" stroke="url(#hillGrad2)" stroke-width="1.3" stroke-linecap="round"/>

          <path d="M0 36.5 L40 36.5" stroke="#D97706" stroke-width="1.4"/>

          <!-- 3 Kalasams -->
          <path d="M20 4.5 L20 7 M17 6 L17 8 M23 6 L23 8" stroke="url(#goldLight2)" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="20" cy="4.5" r="0.8" fill="#FFFBEB"/>
          <circle cx="17" cy="6" r="0.7" fill="#FDE68A"/>
          <circle cx="23" cy="6" r="0.7" fill="#FDE68A"/>

          <!-- Shikhara -->
          <path d="M15 8.5 C16 7, 24 7, 25 8.5 Z" fill="url(#goldLight2)" stroke="#D97706" stroke-width="0.8"/>
          <line x1="14" y1="9" x2="26" y2="9" stroke="url(#goldLight2)" stroke-width="1.2" stroke-linecap="round"/>

          <!-- Tier 1 -->
          <path d="M15.5 9.5 L14.5 13 L25.5 13 L24.5 9.5 Z" fill="#5C0612" fill-opacity="0.3" stroke="url(#goldLight2)" stroke-width="1.1"/>
          <rect x="19" y="10.5" width="2" height="2.5" rx="0.5" fill="url(#goldLight2)"/>
          <line x1="13" y1="13.5" x2="27" y2="13.5" stroke="url(#goldLight2)" stroke-width="1.3" stroke-linecap="round"/>

          <!-- Tier 2 -->
          <path d="M14 14 L12.8 18.5 L27.2 18.5 L26 14 Z" fill="#5C0612" fill-opacity="0.3" stroke="url(#goldLight2)" stroke-width="1.1"/>
          <line x1="16.5" y1="14.5" x2="16.5" y2="18" stroke="url(#goldLight2)" stroke-width="0.9"/>
          <rect x="19" y="15" width="2" height="3" rx="0.5" fill="url(#goldLight2)"/>
          <line x1="23.5" y1="14.5" x2="23.5" y2="18" stroke="url(#goldLight2)" stroke-width="0.9"/>
          <line x1="11.5" y1="19" x2="28.5" y2="19" stroke="url(#goldLight2)" stroke-width="1.4" stroke-linecap="round"/>

          <!-- Tier 3 & Gateway -->
          <path d="M12.5 19.5 L11.2 25 L28.8 25 L27.5 19.5 Z" fill="#5C0612" fill-opacity="0.3" stroke="url(#goldLight2)" stroke-width="1.1"/>
          <path d="M17.5 25.5 V21 C17.5 19.8, 22.5 19.8, 22.5 21 V25.5" fill="#FFFBEB" fill-opacity="0.4" stroke="url(#goldLight2)" stroke-width="1.2"/>
          <circle cx="20" cy="22.5" r="1.2" fill="#FFFBEB"/>
          <line x1="10" y1="25.5" x2="30" y2="25.5" stroke="url(#goldLight2)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
